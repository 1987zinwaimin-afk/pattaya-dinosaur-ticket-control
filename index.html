function readTickets(){try{return JSON.parse(localStorage.getItem('tctl-new-tickets')||'[]')}catch{return []}}
function save(){
 localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets));
 if(!currentUser||!cloudReady)return;
 const snapshot=tickets.map(t=>({id:t.id,department:t.department,name:t.name,price:t.price,quantity:t.quantity,image_path:t.imagePath||null,image_url:t.imageUrl||null,location:t.location||null,created_by:t.createdBy||currentUser.id,updated_by:currentUser.id,created_at:t.createdAt||new Date().toISOString(),updated_at:t.updatedAt||new Date().toISOString()}));
 syncTickets(snapshot);
}
let syncBusy=false;
async function syncTickets(snapshot){
 if(syncBusy)return; syncBusy=true;
 try{
  if(snapshot.length){const {error}=await sb.from('tickets').upsert(snapshot,{onConflict:'id'});if(error)throw error;}
 }catch(e){console.error('Cloud sync failed',e);showCloudError('Cloud sync failed: '+(e.message||e));}
 finally{syncBusy=false}
}
function showCloudError(msg){const e=document.getElementById('authError');if(e&&document.getElementById('authScreen').style.display!=='none')e.textContent=msg;else console.error(msg)}
function mapCloud(row){return {id:row.id,department:row.department,name:row.name,price:row.price===null?null:Number(row.price),quantity:Number(row.quantity||0),image:row.image_url||null,imageUrl:row.image_url||null,imagePath:row.image_path||null,location:row.location||'',createdAt:row.created_at,updatedAt:row.updated_at,createdBy:row.created_by}}
async function loadCloud(){
 const {data,error}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
 if(error)throw error;
 tickets=(data||[]).map(mapCloud);cloudReady=true;localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets));render();
}
function listenRealtime(){
 if(cloudChannel)sb.removeChannel(cloudChannel);
 cloudChannel=sb.channel('ticket-control-live').on('postgres_changes',{event:'*',schema:'public',table:'tickets'},async()=>{try{await loadCloud()}catch(e){console.error(e)}}).subscribe();
}
async function startCloudSession(session){
 currentUser=session.user;
 document.getElementById('authScreen').style.display='none';
 const {data:profile}=await sb.from('profiles').select('role,display_name').eq('id',currentUser.id).maybeSingle();
 currentRole=profile?.role||'staff';
 try{await loadCloud();listenRealtime()}catch(e){showCloudError('Could not load cloud tickets: '+e.message)}
}
function setAuthMode(mode){authMode=mode;document.getElementById('authSubmit').textContent=mode==='signin'?'Sign in':'Create account';document.getElementById('authToggle').textContent=mode==='signin'?'Create account':'Back to sign in';document.getElementById('authName').style.display=mode==='signup'?'block':'none';document.getElementById('authIntro').textContent=mode==='signup'?'First account becomes Owner; later accounts become Staff.':'Owner / Staff Cloud Login';document.getElementById('authError').textContent=''}
document.getElementById('authName').style.display='none';
document.getElementById('authToggle').onclick=()=>setAuthMode(authMode==='signin'?'signup':'signin');
document.getElementById('authForm').onsubmit=async e=>{
 e.preventDefault();const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPassword').value,name=document.getElementById('authName').value.trim();
 const err=document.getElementById('authError');err.textContent='Connecting…';
 try{
  if(authMode==='signup'){
   const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name||email.split('@')[0]}}});
   if(error)throw error;
   if(data.session){await startCloudSession(data.session)}else{err.textContent='Account created. Check your email to confirm, then sign in.'}
  }else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await startCloudSession(data.session)}
 }catch(e){err.textContent=e.message||'Authentication failed'}
};
sb.auth.getSession().then(({data})=>{if(data.session)startCloudSession(data.session)});

function tr(k){return T[lang][k]||k}function dep(){return DEPTS.find(d=>d.id===page)}function money(n){return '฿'+Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function departmentTickets(){return tickets.filter(t=>t.department===page)}
function navRender(){document.getElementById('nav').innerHTML=PAGES.map(p=>'<button class="'+(page===p.id?'active':'')+'" data-page="'+p.id+'">'+p.icon+' '+(p[lang]||p.en)+'</button>').join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page))}
function go(p){page=p;document.getElementById('side').classList.remove('open');document.getElementById('shade').classList.remove('open');render()}
function render(){navRender();let p=PAGES.find(x=>x.id===page);document.getElementById('pageTitle').textContent=p?(p[lang]||p.en):'Ticket Control';document.getElementById('language').value=lang;
let visible=dep()?departmentTickets():tickets;
let total=visible.reduce((a,t)=>a+t.quantity,0),value=visible.reduce((a,t)=>a+t.quantity*(t.price||0),0);
document.getElementById('stats').innerHTML='<div class="stat"><span>'+tr('types')+'</span><strong>'+visible.length+'</strong></div><div class="stat"><span>'+tr('qty')+'</span><strong>'+total.toLocaleString()+'</strong></div><div class="stat"><span>'+tr('value')+'</span><strong>'+money(value)+'</strong></div>';
if(dep())renderDept(visible);else if(page==='dashboard')renderDashboard();else if(page==='monthly')renderMonthly();else if(page==='settings')renderSettings();else if(page==='owner'||page==='staff')renderDatabase();else renderDashboard()}
function renderDashboard(){let all=tickets.reduce((s,t)=>s+t.quantity,0),val=tickets.reduce((s,t)=>s+t.quantity*(t.price||0),0);document.getElementById('pageContent').innerHTML='<div class="section-title"><h2>Ticket Control Overview</h2><span class="subtle">New workspace</span></div><div class="cards">'+DEPTS.map(d=>{let a=tickets.filter(t=>t.department===d.id),q=a.reduce((s,t)=>s+t.quantity,0),v=a.reduce((s,t)=>s+t.quantity*(t.price||0),0);return '<button class="panel" data-page="'+d.id+'" style="text-align:left;min-height:130px"><div style="font-size:28px">'+d.icon+'</div><b>'+(d[lang]||d.en)+'</b><div class="subtle">'+a.length+' '+tr('types')+'</div><strong style="color:var(--gold);font-size:1.25rem">'+q+' · '+money(v)+'</strong></button>'}).join('')+'</div><div class="panel" style="margin-top:16px"><h3>Quick actions</h3><div class="actions"><button class="gold" id="dashAdd">＋ Add ticket</button><button id="dashReport">'+tr('save')+'</button></div><p class="subtle">'+tr('cloudMsg')+'</p></div>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.getElementById('dashAdd').onclick=()=>{page='sale';openTicket()};document.getElementById('dashReport').onclick=saveReport}
function renderDept(list){let d=dep();document.getElementById('pageContent').innerHTML='<div class="actions"><button class="gold" id="addBtn">＋ Add</button><button id="saveBtn">▤ Save</button><button class="blue" id="shareBtn">↗ Share</button></div><input class="search" id="search" placeholder="'+tr('search')+'"><div class="cards" id="ticketCards"></div>';document.getElementById('addBtn').onclick=()=>openTicket();document.getElementById('saveBtn').onclick=saveReport;document.getElementById('shareBtn').onclick=shareReport;document.getElementById('search').oninput=e=>cards(list.filter(t=>t.name.toLowerCase().includes(e.target.value.toLowerCase())));cards(list)}
function cards(list){let root=document.getElementById('ticketCards');if(!root)return;if(!list.length){root.innerHTML='<div class="empty" style="grid-column:1/-1">'+tr('none')+'<p>'+tr('noHint')+'</p></div>';return}root.innerHTML=list.map(t=>'<article class="panel ticket"><div class="'+(t.image?'':'placeholder')+'">'+(t.image?'<img src="'+t.image+'" alt="'+esc(t.name)+'">':DEPTS.find(d=>d.id===t.department).icon)+'</div><div class="ticket-body"><h3>'+esc(t.name)+'</h3><div class="price">'+(t.price===null?'Price not set':money(t.price))+'</div>'+(t.location?'<div class="subtle">📍 '+esc(t.location)+'</div>':'')+'<div class="soldrow"><span>'+tr('sold')+'</span><b>'+tr('total')+': '+t.quantity.toLocaleString()+'</b></div><input class="qty" type="number" min="0" step="1" inputmode="numeric" placeholder="'+tr('addQty').replace('＋ ','')+'" data-qty="'+t.id+'" aria-label="'+tr('addQty')+'"><div class="ticket-actions"><button class="blue edit" data-edit="'+t.id+'">'+tr('edit')+'</button><button data-more="'+t.id+'">'+tr('more')+'</button></div><div class="morebox" id="more-'+t.id+'"><button data-clear="'+t.id+'">'+tr('clear')+'</button><button class="red delete" data-delete="'+t.id+'">'+tr('del')+'</button></div></div></article>').join('');
root.querySelectorAll('[data-qty]').forEach(inp=>{inp.value='';inp.addEventListener('focus',()=>{lastInput[inp.dataset.qty]=inp.value});inp.addEventListener('blur',()=>{let n=Math.floor(Number(inp.value));if(inp.value.trim()!==''&&Number.isFinite(n)&&n>0){let t=tickets.find(x=>x.id===inp.dataset.qty);if(t){t.quantity+=n;t.updatedAt=new Date().toISOString();save();render()}}});inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur()}})});
root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openTicket(b.dataset.edit));root.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.morebox.open').forEach(x=>{if(x.id!=='more-'+b.dataset.more)x.classList.remove('open')});document.getElementById('more-'+b.dataset.more).classList.toggle('open')});root.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{let t=tickets.find(x=>x.id===b.dataset.clear);if(t&&confirm('Clear quantity for '+t.name+'?')){t.quantity=0;t.updatedAt=new Date().toISOString();save();render()}});root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let t=tickets.find(x=>x.id===b.dataset.delete);if(t&&confirm('Delete '+t.name+'?')){tickets=tickets.filter(x=>x.id!==t.id);if(currentUser&&cloudReady){sb.from('tickets').delete().eq('id',t.id).then(({error})=>{if(error)showCloudError(error.message)});if(t.imagePath)sb.storage.from('ticket-images').remove([t.imagePath])}save();render()}})}
function openTicket(id){let t=tickets.find(x=>x.id===id);document.getElementById('ticketForm').reset();document.getElementById('editId').value=id||'';document.getElementById('ticketInitial').value=t?t.quantity:0;document.getElementById('ticketName').value=t?t.name:'';document.getElementById('ticketPrice').value=t&&t.price!==null?t.price:'';document.getElementById('eventLocation').value=t&&t.location||'';document.getElementById('modalTitle').textContent=t?tr('editTitle'):tr('newTitle');document.getElementById('eventLocationLabel').classList.toggle('hidden',page!=='event');document.getElementById('eventLocation').classList.toggle('hidden',page!=='event');document.getElementById('ticketModal').classList.add('open')}
document.getElementById('cancelModal').onclick=()=>document.getElementById('ticketModal').classList.remove('open');document.getElementById('ticketForm').onsubmit=async e=>{e.preventDefault();let id=document.getElementById('editId').value,name=document.getElementById('ticketName').value.trim(),priceText=document.getElementById('ticketPrice').value,quantity=Math.max(0,Math.floor(Number(document.getElementById('ticketInitial').value)||0)),file=document.getElementById('imageFile').files[0],image=null;if(file){if(file.size>1200000){alert('Please choose an image smaller than 1.2 MB.');return}image=await new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}let old=tickets.find(t=>t.id===id);let ticketId=id||crypto.randomUUID(),imagePath=old?.imagePath||null,imageUrl=old?.imageUrl||old?.image||null;
if(file){
 if(!currentUser){alert('Please sign in first.');return}
 const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
 imagePath=currentUser.id+'/'+ticketId+'/'+Date.now()+'.'+ext;
 const {error:uploadError}=await sb.storage.from('ticket-images').upload(imagePath,file,{upsert:true,contentType:file.type||'image/jpeg'});
 if(uploadError){alert('Image upload failed: '+uploadError.message);return}
 const {data:urlData}=sb.storage.from('ticket-images').getPublicUrl(imagePath);imageUrl=urlData.publicUrl;
}
let obj={id:ticketId,department:page,name,price:priceText===''?null:Number(priceText),quantity,image:imageUrl,imageUrl,imagePath,location:page==='event'?document.getElementById('eventLocation').value.trim():'',createdAt:old?old.createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),createdBy:old?.createdBy||currentUser.id};if(old){tickets=tickets.map(t=>t.id===ticketId?obj:t)}else tickets.push(obj);save();document.getElementById('ticketModal').classList.remove('open');render()};
function saveReport(){let list=dep()?departmentTickets():tickets;let lines=[['Department','Ticket name','Price THB','Quantity','Inventory value','Event location'].join(','),...list.map(t=>[DEPTS.find(d=>d.id===t.department).en,'"'+t.name.replaceAll('"','""')+'"',t.price??'',t.quantity,(t.price||0)*t.quantity,'"'+(t.location||'').replaceAll('"','""')+'"'].join(','))];let blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(dep()?page:'all')+'-ticket-report-'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(a.href)}
async function shareReport(){let list=dep()?departmentTickets():tickets;let text=(dep()?dep().en:'Ticket Control Report')+'\n'+new Date().toLocaleString()+'\n'+list.map(t=>t.name+': '+t.quantity+' × '+(t.price===null?'price not set':money(t.price))).join('\n')+'\nTOTAL: '+list.reduce((s,t)=>s+t.quantity,0);if(navigator.share){try{await navigator.share({title:'Ticket Report',text})}catch(e){}}else{try{await navigator.clipboard.writeText(text);alert('Report copied.')}catch{prompt('Copy report',text)}}}
function renderMonthly(){document.getElementById('pageContent').innerHTML='<div class="panel"><h2>'+tr('report')+'</h2><label>'+tr('from')+'</label><input type="date" id="fromDate"><label>'+tr('to')+'</label><input type="date" id="toDate"><div class="actions"><button class="gold" id="makeMonthly">'+tr('report')+'</button><button id="downloadMonthly">'+tr('save')+'</button><button class="blue" id="shareMonthly">'+tr('share')+'</button></div><div id="monthlyResults"></div><p class="subtle">Report date filters use ticket creation/update records available in this browser. Cloud history is not connected.</p></div>';let today=new Date(),first=new Date(today.getFullYear(),today.getMonth(),1);document.getElementById('fromDate').value=first.toISOString().slice(0,10);document.getElementById('toDate').value=today.toISOString().slice(0,10);let calc=()=>{let f=document.getElementById('fromDate').value,t=document.getElementById('toDate').value;return tickets.filter(x=>(x.updatedAt||x.createdAt).slice(0,10)>=f&&(x.updatedAt||x.createdAt).slice(0,10)<=t)};let report=()=>{let a=calc(),q=a.reduce((s,x)=>s+x.quantity,0),v=a.reduce((s,x)=>s+x.quantity*(x.price||0),0);document.getElementById('monthlyResults').innerHTML='<div class="summary-row"><span>'+tr('types')+'</span><b>'+a.length+'</b></div><div class="summary-row"><span>'+tr('qty')+'</span><b>'+q+'</b></div><div class="summary-row"><span>'+tr('value')+'</span><b>'+money(v)+'</b></div>'+DEPTS.map(d=>{let x=a.filter(y=>y.department===d.id);return '<div class="summary-row"><span>'+d.icon+' '+(d[lang]||d.en)+'</span><b>'+x.reduce((s,y)=>s+y.quantity,0)+'</b></div>'}).join('')};document.getElementById('makeMonthly').onclick=report;document.getElementById('downloadMonthly').onclick=()=>{report();saveReport()};document.getElementById('shareMonthly').onclick=shareReport;report()}
