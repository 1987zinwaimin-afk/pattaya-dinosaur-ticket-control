function exportTrainCsv(){const rows=[['No','Date','Depart Time','Return Time','Riders','Driver Name','Duration minutes'],...trainRows.map((r,i)=>[i+1,r.trip_date,fmtTime(r.depart_time),fmtTime(r.return_time),r.riders,r.driver_name,durationMins(r.depart_time,r.return_time)??''])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='train-time-report-'+localToday()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function cloudRowForTicket(t){
 return {id:t.id,department:t.department,name:t.name,price:t.price??null,quantity:Number(t.quantity||0),image_path:t.imagePath||null,image_url:t.imageUrl||null,location:t.location||null,created_by:t.createdBy||currentUser.id,updated_by:currentUser.id,created_at:t.createdAt||new Date().toISOString(),updated_at:t.updatedAt||new Date().toISOString()};
}
function save(){
 try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(storageError){console.warn('Local cache full; Cloud sync will continue.',storageError)}
 if(!currentUser||!cloudReady)return;
 const changed=[];
 for(const t of tickets){
  const row=cloudRowForTicket(t);
  const prior=lastCloudRows.get(String(t.id));
  const fields=['department','name','price','quantity','image_path','image_url','location'];
  const differs=!prior||fields.some(k=>(prior[k]??null)!==(row[k]??null));
  if(differs){row.updated_at=new Date().toISOString();t.updatedAt=row.updated_at;changed.push(row)}
 }
 if(changed.length)syncTickets(changed);
}
let syncBusy=false,syncPending=null;
async function syncTickets(snapshot){
 syncPending=snapshot;
 if(syncBusy)return;
 syncBusy=true;
 try{
  while(syncPending){
   const next=syncPending;syncPending=null;
   if(next.length){const {error}=await sb.from('tickets').upsert(next,{onConflict:'id'});if(error)throw error;for(const row of next)lastCloudRows.set(String(row.id),row);lastCloudFingerprint='';const banner=document.getElementById('cloudSyncStatus');if(banner)banner.style.display='none';}
  }
 }catch(e){console.error('Cloud sync failed',e);showCloudError('Cloud sync failed: '+(e.message||e));syncPending=syncPending||snapshot;setTimeout(()=>{if(!syncBusy&&syncPending)syncTickets(syncPending)},3000);}
 finally{syncBusy=false;if(syncPending)syncTickets(syncPending);}
}
function showCloudError(msg){
 console.error(msg);
 let banner=document.getElementById('cloudSyncStatus');
 if(!banner){banner=document.createElement('div');banner.id='cloudSyncStatus';banner.style.cssText='position:fixed;z-index:99999;left:10px;right:10px;bottom:10px;padding:12px 14px;border-radius:12px;background:#7f1d1d;color:#fff;font:14px/1.4 system-ui;box-shadow:0 4px 20px #0005';document.body.appendChild(banner)}
 banner.textContent='Cloud Sync Error: '+msg;
 banner.style.display='block';
 const e=document.getElementById('authError');if(e&&document.getElementById('authScreen').style.display!=='none')e.textContent=msg;
}
function mapCloud(row){return {id:row.id,department:row.department,name:row.name,price:row.price===null?null:Number(row.price),quantity:Number(row.quantity||0),image:row.image_url||null,imageUrl:row.image_url||null,imagePath:row.image_path||null,location:row.location||'',createdAt:row.created_at,updatedAt:row.updated_at,createdBy:row.created_by}}
async function loadCloud(){
 // Capture local tickets before reading Cloud: the Owner browser may contain the only surviving copy.
 let localTicketsBeforeCloud=[];
 const parseTicketCache=(key)=>{try{const v=JSON.parse(localStorage.getItem(key)||'[]');return Array.isArray(v)?v:[]}catch(e){console.warn('Could not parse '+key,e);return []}};
 try{
  const live=parseTicketCache('tctl-new-tickets');
  const backup=parseTicketCache('tctl-local-backup-before-cloud');
  localTicketsBeforeCloud=live.length?live:backup;
  // Search other ticket-related keys on this same new-site origin for recoverable arrays.
  // Never read data from another website origin and never overwrite non-empty Cloud data.
  if(!localTicketsBeforeCloud.length){
   const isTicketArray=(v)=>Array.isArray(v)&&v.some(t=>t&&['sale','entry','playing','event'].includes(t.department)&&String(t.name||'').trim());
   for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(!key||!/(ticket|tctl)/i.test(key)||['tctl-new-tickets','tctl-local-backup-before-cloud'].includes(key))continue;
    try{const v=JSON.parse(localStorage.getItem(key)||'null');if(isTicketArray(v)){localTicketsBeforeCloud=v;console.warn('Found recoverable ticket data in local key:',key);break}}catch(e){}
   }
  }
  console.log('Local recovery candidates:',{live:live.length,backup:backup.length,selected:localTicketsBeforeCloud.length});
 }catch(e){console.warn('Could not inspect local ticket caches',e)}
 // Do not write a duplicate backup to localStorage; it can exceed mobile browser quota.
 // Read existing cache/backup if present, but leave them untouched.
 const {data,error}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
 if(error)throw error;
 let cloudRows=data||[];
 // One-time recovery: when the cloud table is empty but this browser has tickets, migrate that local copy to Cloud.
 // Never overwrite non-empty Cloud data and never delete local tickets during recovery.
 if(cloudRows.length===0 && localTicketsBeforeCloud.length>0){
  const recovered=[];
  for(const t of localTicketsBeforeCloud){
   if(!t||!['sale','entry','playing','event'].includes(t.department)||!String(t.name||'').trim())continue;
   if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(t.id||'')))t.id=crypto.randomUUID();
   let imageUrl=t.imageUrl||t.image||null,imagePath=t.imagePath||null;
   if(typeof imageUrl==='string' && imageUrl.startsWith('data:') && currentUser){
    try{
     const blob=await (await fetch(imageUrl)).blob();
     const ext=(blob.type.split('/')[1]||'jpeg').replace(/[^a-z0-9]/gi,'')||'jpg';
     const path=currentUser.id+'/'+t.id+'/recovered-'+Date.now()+'.'+ext;

function renderSettings(){
 document.getElementById('pageContent').innerHTML='<div class="panel"><h2>'+tr('cloud')+'</h2><p>'+tr('cloudMsg')+'</p><div class="summary-row"><span>Language / ภาษา</span><select id="settingLang" style="max-width:140px"><option value="en">English</option><option value="th">ไทย</option></select></div><div class="summary-row"><span>Display theme</span><select id="themeSelect" style="max-width:160px"><option value="dark">Dark · Navy + Gold</option><option value="light">Light · Daylight</option></select></div><p class="subtle">Premium Dark Navy + Champagne Gold is the default. Ticket records are synced to the Ticket Control Live cloud database.</p><button id="exportAll" class="gold">Export current tickets (JSON)</button><div style="height:10px"></div><button id="scanRecovery">Scan this website for old ticket backups</button><div style="height:10px"></div><button id="downloadRecovery">Download recovery file (ticket-related keys only)</button><div style="height:10px"></div><label for="recoveryFile">Import a previous ticket backup (JSON)</label><input id="recoveryFile" type="file" accept=".json,application/json"><button id="importRecovery" class="gold" style="margin-top:8px">Restore tickets from selected backup</button><pre id="recoveryResults" style="white-space:pre-wrap;overflow-wrap:anywhere;background:#07182a;padding:12px;border-radius:10px;margin-top:12px;display:none"></pre></div>';
 document.getElementById('settingLang').value=lang;document.getElementById('settingLang').onchange=e=>{lang=e.target.value;localStorage.setItem('tctl-lang',lang);render()};
 document.getElementById('themeSelect').value=theme;document.getElementById('themeSelect').onchange=e=>{theme=e.target.value;localStorage.setItem('tctl-theme',theme);applyTheme()};
 document.getElementById('exportAll').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tickets,null,2)],{type:'application/json'}));a.download='ticket-control-current-backup.json';a.click();URL.revokeObjectURL(a.href)};
 const scanLocal=()=>{
  const keys=[];let validTicketArrays=0;
  for(let i=0;i<localStorage.length;i++){
   const key=localStorage.key(i);if(!key||!/(ticket|tctl)/i.test(key))continue;
   const raw=localStorage.getItem(key);let count=0,parseable=false;
   try{const value=JSON.parse(raw);parseable=true;if(Array.isArray(value)){count=value.filter(t=>t&&['sale','entry','playing','event'].includes(t.department)&&String(t.name||'').trim()).length;if(count)validTicketArrays++}else if(value&&Array.isArray(value.tickets)){count=value.tickets.filter(t=>t&&['sale','entry','playing','event'].includes(t.department)&&String(t.name||'').trim()).length;if(count)validTicketArrays++}}catch(e){}
   keys.push({key,bytes:raw?new Blob([raw]).size:0,validJson:parseable,ticketRecords:count,raw});
  }
  return {keys,validTicketArrays};
 };
 document.getElementById('scanRecovery').onclick=()=>{
  const found=scanLocal();const out=document.getElementById('recoveryResults');out.style.display='block';
  out.textContent='Website-local storage scan (this new website only)\\n'+found.keys.map(k=>k.key+' — '+k.bytes+' bytes — '+(k.validJson?'JSON':'not JSON')+' — '+k.ticketRecords+' ticket records').join('\\n')+'\\n\\nTicket arrays found: '+found.validTicketArrays+'\\n\\nNo data was deleted or changed. If ticket records show 0, this browser may not contain a recoverable local ticket backup.';
 };
 document.getElementById('downloadRecovery').onclick=()=>{
  const found=scanLocal();const payload={createdAt:new Date().toISOString(),website:location.origin,description:'Recovery export of ticket-related localStorage keys only. Authentication/session keys are excluded.',keys:found.keys.map(({key,bytes,validJson,ticketRecords,raw})=>({key,bytes,validJson,ticketRecords,raw}))};
  const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='ticket-control-local-recovery.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
 document.getElementById('importRecovery').onclick=async()=>{
  const input=document.getElementById('recoveryFile'),out=document.getElementById('recoveryResults'),file=input.files&&input.files[0];
  out.style.display='block';
  if(!file){out.textContent='Select a JSON backup file first. No data changed.';return}
  if(!currentUser||!cloudReady){out.textContent='Owner must be signed in and Cloud connected. No data changed.';return}
  try{
   const parsed=JSON.parse(await file.text());let candidates=[];
   const addArray=v=>{if(Array.isArray(v))candidates.push(...v)};
   addArray(parsed);
   if(parsed&&Array.isArray(parsed.tickets))addArray(parsed.tickets);
   if(parsed&&Array.isArray(parsed.keys))for(const k of parsed.keys){if(!k||typeof k.raw!=='string')continue;try{const v=JSON.parse(k.raw);addArray(v);if(v&&Array.isArray(v.tickets))addArray(v.tickets)}catch(e){}}
   const valid=candidates.filter(t=>t&&['sale','entry','playing','event'].includes(t.department)&&String(t.name||'').trim());
   if(!valid.length){out.textContent='No valid ticket records were found in this JSON file. Nothing was uploaded.';return}
   const existing= new Set(tickets.map(t=>String(t.id)));
   const recovered=[];
   for(const source of valid){
    const t={...source};if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(t.id||'')))t.id=crypto.randomUUID();
    let imageUrl=t.imageUrl||t.image||null,imagePath=t.imagePath||null;
    if(typeof imageUrl==='string'&&imageUrl.startsWith('data:')){
     try{const blob=await(await fetch(imageUrl)).blob();const ext=(blob.type.split('/')[1]||'jpeg').replace(/[^a-z0-9]/gi,'')||'jpg';const path=currentUser.id+'/'+t.id+'/recovered-'+Date.now()+'.'+ext;const {error:upErr}=await sb.storage.from('ticket-images').upload(path,blob,{upsert:true,contentType:blob.type||'image/jpeg'});if(upErr)throw upErr;imagePath=path;imageUrl=sb.storage.from('ticket-images').getPublicUrl(path).data.publicUrl}catch(imgErr){console.warn('Image recovery failed',imgErr);imageUrl=null}
    }
    if(typeof imageUrl==='string'&&imageUrl.startsWith('data:'))imageUrl=null;
    t.imagePath=imagePath;t.imageUrl=imageUrl;t.image=imageUrl;
    const row=cloudRowForTicket(t);row.created_by=currentUser.id;row.updated_by=currentUser.id;recovered.push(row);
   }
   const {error}=await sb.from('tickets').upsert(recovered,{onConflict:'id'});if(error)throw error;
   const {data,error:readError}=await sb.from('tickets').select('*').order('created_at',{ascending:true});if(readError)throw readError;
   const rows=data||[];tickets=rows.map(mapCloud);lastCloudRows=new Map(rows.map(r=>[String(r.id),r]));lastCloudFingerprint=JSON.stringify(rows.map(r=>[r.id,r.department,r.name,r.price,r.quantity,r.image_path,r.image_url,r.location,r.updated_at]));try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(e){}render();
   out.textContent='Restore complete. Imported '+recovered.length+' ticket records to Ticket Control Live. Cloud now contains '+rows.length+' ticket records.';
  }catch(e){out.textContent='Restore failed: '+(e.message||e)+'. No existing Cloud rows were intentionally deleted.'}
 };
}
