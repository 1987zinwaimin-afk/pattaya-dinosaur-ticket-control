function cloudRowForTicket(t){
 return {id:t.id,department:t.department,name:t.name,price:t.price??null,quantity:Number(t.quantity||0),image_path:t.imagePath||null,image_url:t.imageUrl||null,location:t.location||null,created_by:t.createdBy||currentUser.id,updated_by:currentUser.id,created_at:t.createdAt||new Date().toISOString(),updated_at:t.updatedAt||new Date().toISOString()};

function save(){

 if(!currentUser||!cloudReady)return;
 const changed=[];
 for(const t of tickets){
  const row=cloudRowForTicket(t);
  const prior=lastCloudRows.get(String(t.id));
  const fields=['department','name','price','quantity','image_path','image_url','location'];

let syncBusy=false,syncPending=null;
async function syncTickets(snapshot){
 syncPending=snapshot;
 if(syncBusy)return;
 syncBusy=true;
 try{
  while(syncPending){
   const next=syncPending;syncPending=null;
   if(next.length){const {error}=await sb.from('tickets').upsert(next,{onConflict:'id'});if(error)throw error;for(const row of next)lastCloudRows.set(String(row.id),row);lastCloudFingerprint='';const banner=document.getElementById('cloudSyncStatus');if(banner)banner.style.display='none';}
  }
 }catch(e){console.error('Cloud sync failed',e);showCloudError('Cloud sync failed: '+(e.message||e));syncPending=syncPending||snapshot;setTimeout(()=>{if(!syncBusy&&syncPending)syncTickets(syncPending)},3000);}
 finally{syncBusy=false;if(syncPending)syncTickets(syncPending);}
}

async function loadCloud(){
 // Capture local tickets before reading Cloud: the Owner browser may contain the only surviving copy.

  const live=parseTicketCache('tctl-new-tickets');
  const backup=parseTicketCache('tctl-local-backup-before-cloud');
  localTicketsBeforeCloud=live.length?live:backup;
  // Search other ticket-related keys on this same new-site origin for recoverable arrays.
  // Never read data from another website origin and never overwrite non-empty Cloud data.
  if(!localTicketsBeforeCloud.length){
   const isTicketArray=(v)=>Array.isArray(v)&&v.some(t=>t&&['sale','entry','playing','event'].includes(t.department)&&String(t.name||'').trim());
   for(let i=0;i<localStorage.length;i++){
    const key=localStorage.key(i);
    if(!key||!/(ticket|tctl)/i.test(key)||['tctl-new-tickets','tctl-local-backup-before-cloud'].includes(key))continue;
    try{const v=JSON.parse(localStorage.getItem(key)||'null');if(isTicketArray(v)){localTicketsBeforeCloud=v;console.warn('Found recoverable ticket data in local key:',key);break}}catch(e){}
   }
  }

 }catch(e){console.warn('Could not inspect local ticket caches',e)}
 // Do not write a duplicate backup to localStorage; it can exceed mobile browser quota.

 if(error)throw error;
 let cloudRows=data||[];
 // One-time recovery: when the cloud table is empty but this browser has tickets, migrate that local copy to Cloud.
 // Never overwrite non-empty Cloud data and never delete local tickets during recovery.
 if(cloudRows.length===0 && localTicketsBeforeCloud.length>0){
  const recovered=[];
  for(const t of localTicketsBeforeCloud){
   if(!t||!['sale','entry','playing','event'].includes(t.department)||!String(t.name||'').trim())continue;
   if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(t.id||'')))t.id=crypto.randomUUID();
   let imageUrl=t.imageUrl||t.image||null,imagePath=t.imagePath||null;
   if(typeof imageUrl==='string' && imageUrl.startsWith('data:') && currentUser){
    try{
     const blob=await (await fetch(imageUrl)).blob();
     const ext=(blob.type.split('/')[1]||'jpeg').replace(/[^a-z0-9]/gi,'')||'jpg';
     const path=currentUser.id+'/'+t.id+'/recovered-'+Date.now()+'.'+ext;
     const {error:uploadError}=await sb.storage.from('ticket-images').upload(path,blob,{upsert:true,contentType:blob.type||'image/jpeg'});
     if(!uploadError){imagePath=path;imageUrl=sb.storage.from('ticket-images').getPublicUrl(path).data.publicUrl}else{console.warn('Could not recover ticket image',uploadError);imageUrl=null}
    }catch(imageError){console.warn('Could not recover ticket image',imageError);imageUrl=null}
   }
   if(typeof imageUrl==='string' && imageUrl.startsWith('data:'))imageUrl=null;
   t.imagePath=imagePath;t.imageUrl=imageUrl;t.image=imageUrl;
   const recoveredRow=cloudRowForTicket(t);recoveredRow.created_by=currentUser.id;recoveredRow.updated_by=currentUser.id;recovered.push(recoveredRow);
  }
  if(recovered.length){
   const {error:migrateError}=await sb.from('tickets').upsert(recovered,{onConflict:'id'});
   if(migrateError)throw new Error('Cloud is empty and local tickets were found, but recovery upload failed: '+migrateError.message);
   const {data:reloaded,error:reloadError}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
   if(reloadError)throw reloadError;
   cloudRows=reloaded||[];
  }
 }
 tickets=cloudRows.map(mapCloud);lastCloudRows=new Map(cloudRows.map(r=>[String(r.id),r]));const syncBanner=document.getElementById('cloudSyncStatus');if(syncBanner)syncBanner.style.display='none';lastCloudFingerprint=JSON.stringify(cloudRows.map(r=>[r.id,r.department,r.name,r.price,r.quantity,r.image_path,r.image_url,r.location,r.updated_at]));cloudReady=true;try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(storageError){console.warn('Local ticket cache is full; using Cloud data for this session.',storageError)}render();
}

let ownerSessionStartPromise=null,ownerSessionStartUserId=null;
async function startCloudSession(session){

 if(currentUser?.id===requestedUserId&&cloudReady){document.getElementById('authScreen').style.display='none';return}
 // Share one initialization for the same account. If another session is being initialized,
 // wait for it to settle before starting this one; never return a different user's pending task.
 if(ownerSessionStartPromise){

  return startCloudSession(session);
 }

   try{
    profileResult=await withAuthTimeout(sb.from('profiles').select('role,display_name').eq('id',requestedUserId).maybeSingle(),'Owner profile lookup',15000);
    if(!profileResult.error)break;
    lastProfileLookupError=profileResult.error;
    if(attempt<3)await new Promise(resolve=>setTimeout(resolve,500*attempt));
   }catch(e){
    lastProfileLookupError=e;
    if(attempt<3)await new Promise(resolve=>setTimeout(resolve,500*attempt));
   }
  }
  if(!profileResult||profileResult.error){
   currentUser=null;document.getElementById('authScreen').style.display='grid';
   const detail=lastProfileLookupError?.message||'No response from the profiles table';
   throw new Error('Owner profile check failed after 3 attempts: '+detail+'. Your login session and saved ticket data were not deleted. Please tap Sign in again.');
  }
  const {data:profile,error:profileError}=profileResult;
  if(profileError||!profile){currentUser=null;document.getElementById('authScreen').style.display='grid';throw new Error(profileError?'Owner profile lookup error: '+profileError.message:'This account has no profile record. Existing data was not changed.')}
  currentRole=profile.role;
  if(currentRole!=='owner'){currentUser=null;document.getElementById('authScreen').style.display='grid';throw new Error('This account is not marked as Owner. Please use the existing Owner account; do not create another account.')}
  document.getElementById('authScreen').style.display='none';

  catch(e){showCloudError('Signed in, but cloud data did not finish loading: '+e.message);throw new Error('Signed in successfully, but ticket data did not finish loading. Check your connection and press Refresh. '+e.message)}
 })();

 try{return await startPromise}finally{
  if(ownerSessionStartPromise===startPromise){ownerSessionStartPromise=null;ownerSessionStartUserId=null}

function openStaffProfileEdit(row,profile){const modal=document.getElementById('staffProfileModal');if(!modal)return;modal.classList.add('open');modal.dataset.removePhoto='0';document.getElementById('staffProfileUserId').value=row.user_id||'';document.getElementById('staffProfileOldName').value=row.display_name||'';document.getElementById('staffProfileName').value=profile?.display_name||row.display_name||'';document.getElementById('staffProfilePhoto').value='';document.getElementById('staffProfileError').textContent='';document.getElementById('staffProfilePreview').innerHTML=profile?.avatar_url?'<img alt="Staff profile" src="'+esc(profile.avatar_url)+'" style="width:84px;height:84px;object-fit:cover;border-radius:50%;border:3px solid var(--gold)">':'<div style="width:84px;height:84px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;font-size:30px;color:var(--gold)">'+esc((profile?.display_name||row.display_name||'S').slice(0,1).toUpperCase())+'</div>'}

let staffAvatarCropState=null;
function drawStaffAvatarCrop(){const s=staffAvatarCropState,canvas=document.getElementById('staffAvatarCropCanvas');if(!s||!canvas)return;const ctx=canvas.getContext('2d'),size=canvas.width;ctx.clearRect(0,0,size,size);ctx.fillStyle='#06182b';ctx.fillRect(0,0,size,size);const base=Math.max(size/s.image.width,size/s.image.height),scale=base*s.zoom,w=s.image.width*scale,h=s.image.height*scale;const x=(size-w)/2+s.offsetX,y=(size-h)/2+s.offsetY;ctx.save();ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip();ctx.drawImage(s.image,x,y,w,h);ctx.restore()}
function setupStaffAvatarCrop(file){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);const panel=document.getElementById('staffAvatarCropPanel');if(!panel){reject(new Error('Photo crop tool is unavailable.'));return}staffAvatarCropState={image:img,zoom:1,offsetX:0,offsetY:0,dragging:false,lastX:0,lastY:0};panel.style.display='block';const slider=document.getElementById('staffAvatarZoom');slider.value='1';drawStaffAvatarCrop();resolve(true)};img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Could not open the selected photo.'))};img.src=url})}
function exportStaffAvatarCrop(){const s=staffAvatarCropState;if(!s)throw new Error('Choose a photo and adjust it first.');const size=640,base=Math.max(size/s.image.width,size/s.image.height),scale=base*s.zoom,w=s.image.width*scale,h=s.image.height*scale;const factor=size/280,x=(size-w)/2+s.offsetX*factor,y=(size-h)/2+s.offsetY*factor,canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;const ctx=canvas.getContext('2d');ctx.drawImage(s.image,x,y,w,h);return canvas.toDataURL('image/jpeg',.9)}
async function compressStaffAvatar(file){if(!file||!file.type||!file.type.startsWith('image/'))throw new Error('Please choose a valid image file.');if(file.size>100*1024*1024)throw new Error('This photo is over 100 MB. Please choose a smaller original image so your phone can process it safely.');let source=null,bitmap=null,objectUrl=null;try{if('createImageBitmap'in window){bitmap=await createImageBitmap(file);source=bitmap}else{objectUrl=URL.createObjectURL(file);source=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Could not open the selected photo.'));img.src=objectUrl})}const originalWidth=source.width||source.naturalWidth,originalHeight=source.height||source.naturalHeight;if(!originalWidth||!originalHeight)throw new Error('Could not read the selected photo dimensions.');let scale=Math.min(1,320/Math.max(originalWidth,originalHeight));let canvas=document.createElement('canvas');let blob=null;for(let pass=0;pass<5;pass++){canvas.width=Math.max(1,Math.round(originalWidth*scale));canvas.height=Math.max(1,Math.round(originalHeight*scale));const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Photo processing is not supported on this browser.');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(source,0,0,canvas.width,canvas.height);for(const quality of [.78,.66,.54,.42,.32]){blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',quality));if(blob&&blob.size<=180*1024)break}if(blob&&blob.size<=180*1024)break;scale*=.78}if(!blob)throw new Error('Photo compression failed. Please choose another image.');if(blob.size>350*1024)throw new Error('This photo could not be compressed enough on this device. Please choose another photo.');return await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Could not prepare the compressed photo.'));reader.readAsDataURL(blob)})}finally{if(bitmap&&typeof bitmap.close==='function')bitmap.close();if(objectUrl)URL.revokeObjectURL(objectUrl)}}
async function saveStaffProfile(e){
 e.preventDefault();
 const err=document.getElementById('staffProfileError'),btn=document.getElementById('staffProfileSave');
 const userId=document.getElementById('staffProfileUserId').value;
 const name=document.getElementById('staffProfileName').value.trim();
 let file=document.getElementById('staffProfilePhoto').files?.[0];
 const remove=document.getElementById('staffProfileModal').dataset.removePhoto==='1';
 const oldDisplayName=document.getElementById('staffProfileOldName').value.trim();
 if(!userId){err.textContent='This login record is not linked to a staff account. Ask that staff member to log in once, then refresh this page.';return}
 if(!name){err.textContent='Please enter a staff name.';return}
 if(file&&staffAvatarCropState){try{const cropped=exportStaffAvatarCrop();const blob=await (await fetch(cropped)).blob();file=new File([blob],'staff-profile-crop.jpg',{type:'image/jpeg'})}catch(cropError){err.textContent='Could not prepare cropped photo: '+(cropError.message||cropError);return}}
 btn.disabled=true;btn.textContent='Saving…';err.textContent='Preparing photo and saving to cloud…';
 try{
  const {data:existing,error:readError}=await sb.from('profiles').select('id,display_name,avatar_url,role').eq('id',userId).maybeSingle();
  if(readError)throw new Error('Could not read this staff profile: '+readError.message);
  if(!existing||existing.role!=='staff')throw new Error('The selected staff account was not found. No profile data was changed.');
  let avatarUrl=existing.avatar_url||null;
  if(file){
   if(!file.type.startsWith('image/'))throw new Error('Please choose an image file (JPG, PNG or WebP).');
   const dataUrl=await compressStaffAvatar(file);
   const blob=await (await fetch(dataUrl)).blob();
   const path='staff-avatars/'+userId+'/'+Date.now()+'.jpg';
   const {error:uploadError}=await sb.storage.from('ticket-images').upload(path,blob,{upsert:true,contentType:'image/jpeg',cacheControl:'3600'});
   if(uploadError)throw new Error('Cloud photo upload failed: '+uploadError.message);
   avatarUrl=sb.storage.from('ticket-images').getPublicUrl(path).data.publicUrl;
   if(!avatarUrl)throw new Error('The photo uploaded, but its public URL could not be created.');
  }else if(remove){avatarUrl=null}
  // Save the selected account first and verify the returned row, so a successful
  // upload cannot silently appear saved while the selected profile remains empty.
  const {data:saved,error:saveError}=await sb.from('profiles').update({display_name:name,avatar_url:avatarUrl}).eq('id',userId).eq('role','staff').select('id,display_name,avatar_url').maybeSingle();
  if(saveError)throw new Error('Photo upload completed, but saving this staff profile failed: '+saveError.message);
  if(!saved)throw new Error('The profile update returned no row. The photo may be uploaded, but this account was not updated. Check Owner permissions.');
  // Keep the shared avatar consistent for duplicate staff profiles with the same name,
  // while changing only the name/avatar fields and leaving other records untouched.
  if(oldDisplayName){
   const {error:sharedError}=await sb.from('profiles').update({display_name:name,avatar_url:avatarUrl}).eq('role','staff').eq('display_name',oldDisplayName).neq('id',userId);
   if(sharedError)console.warn('Selected profile saved, but duplicate-name profiles were not all synchronized:',sharedError.message);
  }
  const normalized=name.toLocaleLowerCase().replace(/\\s+/g,' ').trim();
  const {data:activity,error:activityReadError}=await sb.from('staff_login_activity').select('*').eq('user_id',userId).maybeSingle();
  if(activityReadError)throw new Error('Profile photo was saved, but activity display could not be updated: '+activityReadError.message);
  if(activity){
   if(normalized!==activity.normalized_name){
    const newRow={...activity,normalized_name:normalized,display_name:name,updated_at:new Date().toISOString()};
    const {error:upsertError}=await sb.from('staff_login_activity').upsert(newRow,{onConflict:'normalized_name'});
    if(upsertError)throw new Error('Profile photo saved, but staff activity name sync failed: '+upsertError.message);
    const {error:deleteError}=await sb.from('staff_login_activity').delete().eq('normalized_name',activity.normalized_name).eq('user_id',userId);
    if(deleteError)throw new Error('Profile photo saved, but old activity label cleanup failed: '+deleteError.message);
   }else{
    const {error:activityUpdateError}=await sb.from('staff_login_activity').update({display_name:name,updated_at:new Date().toISOString()}).eq('normalized_name',activity.normalized_name);
    if(activityUpdateError)throw new Error('Profile photo saved, but activity display sync failed: '+activityUpdateError.message);
   }
  }
  document.getElementById('staffProfileModal').classList.remove('open');
  await loadStaffActivity();
  alert('Staff profile saved to cloud. The selected account was verified. Refresh the Staff website to load the latest photo.');
 }catch(ex){err.textContent='Could not save profile: '+(ex.message||ex)}
 finally{btn.disabled=false;btn.textContent='Save Profile'}
}
async function deleteStaffActivity(normalizedName,displayName,button){if(!normalizedName)return;if(!confirm('Delete login activity for "'+displayName+'"? This removes only the Staff Login Activity record, not the staff account or ticket data.'))return;button.disabled=true;button.textContent='Deleting…';try{const {error}=await sb.from('staff_login_activity').delete().eq('normalized_name',normalizedName);if(error)throw error;await loadStaffActivity()}catch(e){button.disabled=false;button.textContent='Delete';alert('Could not delete login activity: '+(e.message||e)+'\\nCheck the Supabase DELETE policy for staff_login_activity.')}}
async function loadStaffActivity(){const box=document.getElementById('staffActivityList');if(!box||!sb)return;box.innerHTML='Loading staff activity…';try{const {data,error}=await sb.from('staff_login_activity').select('normalized_name,display_name,department,last_seen,logged_in_at,is_active,user_id').order('display_name',{ascending:true});if(error)throw error;const rows=data||[];if(!rows.length){box.innerHTML='<p class="subtle">No staff logins recorded yet. New logins will appear here.</p>';return}const ids=[...new Set(rows.map(r=>r.user_id).filter(Boolean))];const names=[...new Set(rows.map(r=>r.display_name).filter(Boolean))];let profiles=[];if(ids.length){const {data:p,error:pe}=await sb.from('profiles').select('id,display_name,avatar_url,role').in('id',ids);if(pe)throw pe;profiles=p||[]}let nameProfiles=[];if(names.length){const {data:np,error:npe}=await sb.from('profiles').select('id,display_name,avatar_url,role').eq('role','staff').in('display_name',names);if(npe)throw npe;nameProfiles=np||[]}const byId=new Map(profiles.map(p=>[p.id,p]));const avatarByName=new Map();for(const p of [...profiles,...nameProfiles]){const key=String(p.display_name||'').toLocaleLowerCase().replace(/\\s+/g,' ').trim();if(key&&p.avatar_url&&!avatarByName.has(key))avatarByName.set(key,p.avatar_url)}const now=Date.now();const deptNames={sale:'Sale Department',entry:'Entry Department',playing:'Playing Department',event:'Event Department',all:'All Department'};box.innerHTML='<div style="display:grid;gap:12px">'+rows.map((r,i)=>{const active=!!r.is_active&&(now-new Date(r.last_seen).getTime()<90000);const p=byId.get(r.user_id);const nm=p?.display_name||r.display_name;const sharedAvatar=avatarByName.get(String(nm||'').toLocaleLowerCase().replace(/\\s+/g,' ').trim());const photoUrl=p?.avatar_url||sharedAvatar;const avatar=photoUrl?'<img alt="'+esc(nm)+' profile photo" src="'+esc(photoUrl)+'" style="width:88px;height:88px;flex:0 0 88px;object-fit:cover;object-position:center;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 12px #eac35b44">':'<div aria-label="No profile photo" style="width:88px;height:88px;flex:0 0 88px;border-radius:50%;border:3px solid var(--gold);display:grid;place-items:center;color:#f8d978;background:linear-gradient(145deg,#183b5a,#071a2c);box-shadow:0 0 12px #eac35b33"><svg viewBox="0 0 64 64" width="52" height="52" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"><circle cx="32" cy="21" r="12"/><path d="M10 56c1-13 9-20 22-20s21 7 22 20"/></svg></div>';return '<div style="display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:16px;border:1px solid #244969;border-radius:20px;background:linear-gradient(145deg,#071a2c,#0b243b);box-shadow:inset 0 0 0 1px #ffffff05"><div style="display:grid;grid-template-columns:88px minmax(0,1fr);gap:14px;align-items:center">'+avatar+'<div style="min-width:0"><strong style="display:block;overflow-wrap:anywhere;font-size:1.12rem;color:#f6f8ff">'+esc(nm)+'</strong><span style="display:block;color:#c5d7e9;margin-top:4px">'+esc(deptNames[r.department]||r.department||'Unknown Department')+'</span><span style="display:block;color:#a8bfd5;font-size:.82rem;margin-top:7px;overflow-wrap:anywhere">Last login: '+esc(r.logged_in_at?new Date(r.logged_in_at).toLocaleString():'—')+'</span><span style="display:block;color:#a8bfd5;font-size:.82rem;margin-top:3px;overflow-wrap:anywhere">Last activity: '+esc(r.last_seen?new Date(r.last_seen).toLocaleString():'—')+'</span></div></div><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;border-top:1px solid #24415c;padding-top:10px"><span style="font-weight:800;color:'+(active?'#4ade80':'#fb7185')+'">'+(active?'● Active':'● Inactive')+'</span><div style="display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0"><button type="button" class="edit-staff-profile" data-row="'+i+'" style="background:#173b5b;border:1px solid #d6b45c;color:#fff;border-radius:11px;padding:9px 10px;font-size:clamp(12px,3.4vw,16px);font-weight:800;white-space:nowrap;flex:0 1 auto">✎ Edit Profile</button><button type="button" class="delete-staff-activity" data-row="'+i+'" style="background:#7f1d1d;border:1px solid #ef4444;color:#fff;border-radius:11px;padding:9px 10px;font-size:clamp(12px,3.4vw,16px);font-weight:800;white-space:nowrap;flex:0 1 auto">🗑 Delete Activity</button></div></div></div>'}).join('')+'</div>';box.querySelectorAll('.edit-staff-profile').forEach(btn=>btn.onclick=()=>{const r=rows[Number(btn.dataset.row)];if(r)openStaffProfileEdit(r,byId.get(r.user_id))});box.querySelectorAll('.delete-staff-activity').forEach(btn=>btn.onclick=()=>{const r=rows[Number(btn.dataset.row)];if(r)deleteStaffActivity(r.normalized_name,r.display_name,btn)})}catch(e){box.innerHTML='<p style="color:#fb7185">Could not load staff activity: '+esc(e.message||e)+'</p>'}}
function showCreatedOwnerCredentials(email,password){
 const overlay=document.createElement('div');overlay.className='modal open';overlay.style.zIndex='250';
 overlay.innerHTML='<div class="modalbox"><h2>Owner account created</h2><p class="subtle">These credentials are visible only in this Owner session. Save them securely now. The password is not saved in the database and cannot be shown again.</p><label>Owner Gmail</label><div style="display:flex;gap:8px;align-items:center"><input id="createdOwnerEmail" readonly value="'+esc(email)+'"><button type="button" id="copyCreatedOwnerEmail">Copy</button></div><label>Password (one-time display)</label><div style="display:flex;gap:8px;align-items:center"><input id="createdOwnerPassword" type="password" readonly value="'+esc(password)+'"><button type="button" id="toggleCreatedOwnerPassword">Show</button><button type="button" id="copyCreatedOwnerPassword">Copy</button></div><div class="modal-actions"><button type="button" class="gold" id="closeCreatedOwnerCredentials">I saved my login</button></div></div>';
 document.body.appendChild(overlay);
 const emailInput=overlay.querySelector('#createdOwnerEmail'),passwordInput=overlay.querySelector('#createdOwnerPassword');
 overlay.querySelector('#copyCreatedOwnerEmail').onclick=()=>{emailInput.select();document.execCommand('copy')};
 overlay.querySelector('#copyCreatedOwnerPassword').onclick=()=>{passwordInput.type='text';passwordInput.select();document.execCommand('copy');passwordInput.type='password'};
 overlay.querySelector('#toggleCreatedOwnerPassword').onclick=e=>{passwordInput.type=passwordInput.type==='password'?'text':'password';e.currentTarget.textContent=passwordInput.type==='password'?'Show':'Hide'};

}
function applyTheme(){document.body.classList.toggle('theme-light',theme==='light')}
document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('tctl-lang',lang);render()};document.getElementById('openMenu').onclick=()=>{document.getElementById('side').classList.add('open');document.getElementById('shade').classList.add('open')};document.getElementById('ownerLogout').onclick=async()=>{
 const button=document.getElementById('ownerLogout');
 if(button.disabled)return;
 if(!currentUser){document.getElementById('side').classList.remove('open');document.getElementById('shade').classList.remove('open');return}
 button.disabled=true;button.textContent='Logging out…';
 try{
  const {error}=await withAuthTimeout(sb.auth.signOut({scope:'local'}),'Owner logout',12000);
  if(error)throw error;
  if(cloudChannel){await sb.removeChannel(cloudChannel);cloudChannel=null}
  if(cloudPollTimer){clearInterval(cloudPollTimer);cloudPollTimer=null}
  if(staffNotifyTimer){clearInterval(staffNotifyTimer);staffNotifyTimer=null}
  currentUser=null;currentRole='staff';cloudReady=false;lastCloudRows=new Map();lastCloudFingerprint='';
  document.getElementById('side').classList.remove('open');document.getElementById('shade').classList.remove('open');

  document.getElementById('authScreen').style.display='grid';
 }catch(e){
  console.error('Owner logout failed:',e);
  const err=document.getElementById('authError');if(err)err.textContent='Logout failed: '+(e.message||'Please try again.');
 }finally{button.disabled=false;button.textContent='↪ Logout'}
};
