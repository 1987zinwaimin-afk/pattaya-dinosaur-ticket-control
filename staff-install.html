<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07172b">
<meta name="description" content="Install the Pattaya Dinosaur Kingdom Staff Ticket App.">
<link rel="manifest" href="/staff-manifest.json">
<link rel="icon" type="image/svg+xml" href="/staff-app-icon.svg">
<link rel="apple-touch-icon" href="/file_000000006da082119bbf212e4f6fad52.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dino Staff">
<title>Install Staff App · Pattaya Dinosaur Kingdom</title>
<style>
:root{color-scheme:dark;--navy:#07172b;--panel:#102b45;--line:#39556e;--gold:#f4cf7e;--gold2:#dba743;--text:#f5f8fc;--muted:#b7c6d5}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 8%,#1a4162 0,transparent 48%),var(--navy);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
.card{width:min(100%,430px);padding:28px 22px 24px;text-align:center;border:1px solid rgba(244,207,126,.45);border-radius:24px;background:linear-gradient(150deg,rgba(20,53,81,.97),rgba(7,25,43,.98));box-shadow:0 20px 60px #0007}
.logo{width:104px;height:104px;display:block;margin:0 auto 16px;filter:drop-shadow(0 8px 18px #0006)}
h1{margin:0;color:var(--gold);font-size:clamp(23px,6vw,29px);line-height:1.2}
.subtitle{margin:10px 0 22px;color:var(--muted);font-size:14px}
button,.open-link{display:flex;width:100%;min-height:54px;align-items:center;justify-content:center;gap:9px;border:1px solid #ffe6a7;border-radius:14px;background:linear-gradient(135deg,#ffe6a5,#dca53d);color:#15283a;font-size:16px;font-weight:850;text-decoration:none;cursor:pointer;box-shadow:0 5px 0 #815c21}
button:disabled{opacity:.7;cursor:wait}
.status{min-height:46px;margin:17px 0 0;color:#dce7f0;font-size:13px;line-height:1.5}
.steps{margin:15px 0 0;padding:13px 15px;border:1px solid rgba(183,198,213,.2);border-radius:13px;background:#071a2b;color:#d6e1eb;text-align:left;font-size:12px}
.steps[hidden]{display:none}
.steps ol{margin:0;padding-left:19px}
.steps li{margin:5px 0}
.footer{margin:18px 0 0;color:#8298ad;font-size:11px}
#openApp{display:none;margin-top:12px}
#openApp.visible{display:flex}
</style>
</head>
<body>
<main class="card">
<img class="logo" src="/staff-app-icon.svg" alt="Pattaya Dinosaur Kingdom Staff App">
<h1>Pattaya Dinosaur Kingdom</h1>
<p class="subtitle">Staff Ticket Control · Install the official Staff App on your phone.</p>
<button type="button" id="installButton">📲 Install Staff App</button>
<a class="open-link" id="openApp" href="/staff.html">Open Staff App</a>
<p class="status" id="status" role="status" aria-live="polite">Tap Install Staff App to add the app to your Home Screen.</p>
<section class="steps" id="manualSteps" hidden>
<ol id="stepsList"></ol>
</section>
<p class="footer">Secure access · Existing Staff Login and cloud data are unchanged.</p>
</main>
<script>
(()=>{
 const installButton=document.getElementById('installButton');
 const openApp=document.getElementById('openApp');
 const status=document.getElementById('status');
 const manualSteps=document.getElementById('manualSteps');
 const stepsList=document.getElementById('stepsList');
 let deferredPrompt=null;
 const standalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
 const apple=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const showSteps=()=>{
  manualSteps.hidden=false;
  if(apple){
   status.textContent='To install on iPhone or iPad, use Safari’s Add to Home Screen option.';
   stepsList.innerHTML='<li>Open this link in <b>Safari</b>.</li><li>Tap <b>Share</b>.</li><li>Choose <b>Add to Home Screen</b>, then tap <b>Add</b>.</li><li>Open the new Dino Staff icon on your Home Screen.</li>';
  }else{
   status.textContent='Automatic installation is not available in this browser right now. Use the browser menu to install the app.';
   stepsList.innerHTML='<li>Open the browser menu <b>⋮</b>.</li><li>Choose <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Confirm <b>Install</b> or <b>Add</b>.</li>';
  }
 };
 const markInstalled=()=>{
  status.textContent='✓ Staff App installed. You can now open it from your Home Screen.';
  installButton.textContent='✓ Installed';
  installButton.disabled=true;
  openApp.classList.add('visible');
 };
 if(standalone()){
  status.textContent='The Staff App is already open in app mode.';
  installButton.textContent='Open Staff App';
  installButton.onclick=()=>location.replace('/staff.html');
 }else{
  installButton.addEventListener('click',async()=>{
   if(deferredPrompt){
    installButton.disabled=true;
    deferredPrompt.prompt();
    let choice='dismissed';
    try{const result=await deferredPrompt.userChoice;choice=result?.outcome||'dismissed'}catch(_){}
    deferredPrompt=null;
    installButton.disabled=false;
    if(choice==='accepted'){
     status.textContent='Install accepted. Finish the browser confirmation if it appears; then open the Dino Staff icon.';
     installButton.textContent='Install requested';
     openApp.classList.add('visible');
    }else{
     status.textContent='Installation was not completed. You can tap Install again or use the browser menu.';
    }
   }else{
    showSteps();
   }
  });
 }
 window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredPrompt=event;
  manualSteps.hidden=true;
  installButton.disabled=false;
  installButton.textContent='📲 Install Staff App';
  status.textContent='Ready to install. Tap the button to open the phone’s Install confirmation.';
 });
 window.addEventListener('appinstalled',markInstalled);
 if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'}).then(reg=>reg.update()).catch(error=>console.warn('Staff PWA service worker registration failed:',error)));
 }
 if(!standalone()&&!apple){
  installButton.disabled=true;
  status.textContent='Preparing the install option…';
  window.setTimeout(()=>{if(!deferredPrompt&&!installButton.disabled){showSteps()}else if(!deferredPrompt){installButton.disabled=false;showSteps()}},2500);
 }
})();
</script>
</body>
</html>
