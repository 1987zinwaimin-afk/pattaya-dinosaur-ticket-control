function cloudRowForTicket(t){
 return {id:t.id,department:t.department,name:t.name,price:t.price??null,quantity:Number(t.quantity||0),image_path:t.imagePath||null,image_url:t.imageUrl||null,location:t.location||null,created_by:t.createdBy||currentUser.id,updated_by:currentUser.id,created_at:t.createdAt||new Date().toISOString(),updated_at:t.updatedAt||new Date().toISOString()};
}
function save(){
 try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(storageError){console.warn('Local cache full; Cloud sync will continue.',storageError)}
 if(!currentUser||!cloudReady)return;
 const changed=[];
 for(const t of tickets){
  const row=cloudRowForTicket(t);
  const prior=lastCloudRows.get(String(t.id));
  const fields=['department','name','price','quantity','image_path','image_url','location'];
  const differs=!prior||fields.some(k=>(prior[k]??null)!==(row[k]??null));
  if(differs){row.updated_at=new Date().toISOString();t.updatedAt=row.updated_at;changed.push(row)}
 }
 if(changed.length)syncTickets(changed);
}
let syncBusy=false,syncPending=null;
async function syncTickets(snapshot){
 syncPending=snapshot;
 if(syncBusy)return;
 syncBusy=true;
 try{
  while(syncPending){
   const next=syncPending;syncPending=null;
   if(next.length){const {error}=await sb.from('tickets').upsert(next,{onConflict:'id'});if(error)throw error;for(const row of next)lastCloudRows.set(String(row.id),row);lastCloudFingerprint='';const banner=document.getElementById('cloudSyncStatus');if(banner)banner.style.display='none';}
  }
 }catch(e){console.error('Cloud sync failed',e);showCloudError('Cloud sync failed: '+(e.message||e));syncPending=syncPending||snapshot;setTimeout(()=>{if(!syncBusy&&syncPending)syncTickets(syncPending)},3000);}
 finally{syncBusy=false;if(syncPending)syncTickets(syncPending);}
}
function showCloudError(msg){const e=document.getElementById('authError');if(e&&document.getElementById('authScreen').style.display!=='none')e.textContent=msg;else console.error(msg)}
function mapCloud(row){return {id:row.id,department:row.department,name:row.name,price:row.price===null?null:Number(row.price),quantity:Number(row.quantity||0),image:row.image_url||null,imageUrl:row.image_url||null,imagePath:row.image_path||null,location:row.location||'',createdAt:row.created_at,updatedAt:row.updated_at,createdBy:row.created_by}}
async function loadCloud(){
 // Capture local tickets before reading Cloud: the Owner browser may contain the only surviving copy.
 let localTicketsBeforeCloud=[];
 try{localTicketsBeforeCloud=JSON.parse(localStorage.getItem('tctl-new-tickets')||'[]');if(!Array.isArray(localTicketsBeforeCloud))localTicketsBeforeCloud=[]}catch(e){console.warn('Could not parse local ticket cache',e)}
 // Do not write a duplicate backup to localStorage; it can exceed mobile browser quota.
 // Read existing cache/backup if present, but leave them untouched.
 const {data,error}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
 if(error)throw error;
 let cloudRows=data||[];
 // One-time recovery: when the cloud table is empty but this browser has tickets, migrate that local copy to Cloud.
 // Never overwrite non-empty Cloud data and never delete local tickets during recovery.
 if(cloudRows.length===0 && localTicketsBeforeCloud.length>0){
  const recovered=[];
  for(const t of localTicketsBeforeCloud){
   if(!t||!['sale','entry','playing','event'].includes(t.department)||!String(t.name||'').trim())continue;
   if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(t.id||'')))t.id=crypto.randomUUID();
   let imageUrl=t.imageUrl||t.image||null,imagePath=t.imagePath||null;
   if(typeof imageUrl==='string' && imageUrl.startsWith('data:') && currentUser){
    try{
     const blob=await (await fetch(imageUrl)).blob();
     const ext=(blob.type.split('/')[1]||'jpeg').replace(/[^a-z0-9]/gi,'')||'jpg';
     const path=currentUser.id+'/'+t.id+'/recovered-'+Date.now()+'.'+ext;
     const {error:uploadError}=await sb.storage.from('ticket-images').upload(path,blob,{upsert:true,contentType:blob.type||'image/jpeg'});
     if(!uploadError){imagePath=path;imageUrl=sb.storage.from('ticket-images').getPublicUrl(path).data.publicUrl}else{console.warn('Could not recover ticket image',uploadError);imageUrl=null}
    }catch(imageError){console.warn('Could not recover ticket image',imageError);imageUrl=null}
   }
   if(typeof imageUrl==='string' && imageUrl.startsWith('data:'))imageUrl=null;
   t.imagePath=imagePath;t.imageUrl=imageUrl;t.image=imageUrl;
   const recoveredRow=cloudRowForTicket(t);recoveredRow.created_by=currentUser.id;recoveredRow.updated_by=currentUser.id;recovered.push(recoveredRow);
  }
  if(recovered.length){
   const {error:migrateError}=await sb.from('tickets').upsert(recovered,{onConflict:'id'});
   if(migrateError)throw new Error('Cloud is empty and local tickets were found, but recovery upload failed: '+migrateError.message);
   const {data:reloaded,error:reloadError}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
   if(reloadError)throw reloadError;
   cloudRows=reloaded||[];
  }
 }
 tickets=cloudRows.map(mapCloud);lastCloudRows=new Map(cloudRows.map(r=>[String(r.id),r]));lastCloudFingerprint=JSON.stringify(cloudRows.map(r=>[r.id,r.department,r.name,r.price,r.quantity,r.image_path,r.image_url,r.location,r.updated_at]));cloudReady=true;try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(storageError){console.warn('Local ticket cache is full; using Cloud data for this session.',storageError)}render();
}
let cloudPollTimer=null,cloudLoadBusy=false,lastCloudFingerprint='';
async function refreshCloudTickets(force=false){
 if(!currentUser||!cloudReady)return;
 // Do not let an empty/stale read replace local edits while their Cloud upsert is still running.
 if(syncBusy)return;
 // Continue polling even when this tab is in the background; mobile split-screen and tab switching must not stall sync.
 const modal=document.getElementById('ticketModal');
 if(modal&&modal.classList.contains('open')&&!force)return;
 if(cloudLoadBusy)return;
 cloudLoadBusy=true;
 try{
  const {data,error}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
  if(error)throw error;
  const rows=data||[];
  const fingerprint=JSON.stringify(rows.map(r=>[r.id,r.department,r.name,r.price,r.quantity,r.image_path,r.image_url,r.location,r.updated_at]));
  if(force||fingerprint!==lastCloudFingerprint){
   lastCloudFingerprint=fingerprint;
   tickets=rows.map(mapCloud);
   lastCloudRows=new Map(rows.map(r=>[String(r.id),r]));
   try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(storageError){console.warn('Local cache full; Cloud data is still active.',storageError)}
   render();
  }
 }catch(e){console.error('Auto-refresh cloud tickets failed',e)}
 finally{cloudLoadBusy=false}
}
function listenRealtime(){
 if(cloudChannel)sb.removeChannel(cloudChannel);
 cloudChannel=sb.channel('ticket-control-live-'+(currentUser?.id||'session'))
  .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},async()=>{await refreshCloudTickets(true)})
  .subscribe(status=>{console.log('Ticket realtime status:',status)});
 if(cloudPollTimer)clearInterval(cloudPollTimer);
 cloudPollTimer=setInterval(()=>refreshCloudTickets(false),1500);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshCloudTickets(true)});
 window.addEventListener('focus',()=>refreshCloudTickets(true));
}
async function recordStaffActivity(active,firstLogin){

   sel.innerHTML='<option value="'+esc(currentUser.id)+'">My Owner Payroll</option>'+people.filter(p=>p.id!==currentUser.id).map(p=>'<option value="'+esc(p.id)+'">'+esc(p.display_name||'Staff')+' · '+p.id.slice(0,8)+'</option>').join('');
  }catch(e){document.getElementById('payrollSummary').textContent='Could not load staff accounts: '+e.message}
 }
 const start=document.getElementById('payrollStart'),end=document.getElementById('payrollEnd'),rate=document.getElementById('payrollRate');
 const calendar=document.getElementById('payrollCalendar'),summary=document.getElementById('payrollSummary');
 let attendance=[];
 async function load(){
  if(owner)targetUserId=document.getElementById('payrollPerson').value||currentUser.id;
  const {data:setting,error:se}=await sb.from('payroll_settings').select('daily_rate,period_start,period_end').eq('user_id',targetUserId).maybeSingle();
  if(se)throw se;
  if(setting){rate.value=setting.daily_rate;start.value=setting.period_start;end.value=setting.period_end}
  else{rate.value='';if(!start.value)start.value=iso(defaultStart);if(!end.value)end.value=iso(defaultEnd)}
  rate.readOnly=!owner;rate.disabled=!owner;
  document.getElementById('savePayrollSettings').style.display=owner?'inline-flex':'none';
  document.getElementById('payrollRateWrap').querySelector('label').textContent=owner?'Daily wage (THB)':'Daily wage set by Owner (THB)';
  if(!owner&&!setting)rate.placeholder='Owner has not set the daily wage yet';
  if(!start.value||!end.value||start.value>end.value){calendar.innerHTML='<p class="auth-error">Please select a valid salary period.</p>';return}
  const {data:rows,error}=await sb.from('payroll_attendance').select('work_date,status,note').eq('user_id',targetUserId).gte('work_date',start.value).lte('work_date',end.value).order('work_date');
  if(error)throw error;attendance=rows||[];
  const map=new Map(attendance.map(x=>[x.work_date,x]));
  const from=new Date(start.value+'T12:00:00'),to=new Date(end.value+'T12:00:00');
  const days=[];for(let d=new Date(from);d<=to;d.setDate(d.getDate()+1)){const key=iso(d),row=map.get(key);days.push({date:key,status:row?.status||''})}
  calendar.innerHTML='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px">'+days.map(d=>'<label style="display:block;border:1px solid var(--line);border-radius:12px;padding:9px"><span style="display:block;font-weight:700;margin-bottom:6px">'+new Date(d.date+'T12:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'short',weekday:'short'})+'</span><select class="payroll-day" data-date="'+d.date+'" style="width:100%"><option value="">Not marked</option><option value="work" '+(d.status==='work'?'selected':'')+'>Work day</option><option value="off" '+(d.status==='off'?'selected':'')+'>Day off</option></select></label>').join('')+'</div>';
  const work=attendance.filter(x=>x.status==='work').length,off=attendance.filter(x=>x.status==='off').length,dayRate=Number(setting?.daily_rate||0),amount=work*dayRate;
  summary.innerHTML='<div class="summary-row"><span>Work days</span><b>'+work+' days</b></div><div class="summary-row"><span>Days off</span><b>'+off+' days</b></div><div class="summary-row"><span>Daily wage</span><b>'+money(dayRate)+'</b></div><div class="summary-row"><span>Calculation</span><b>'+work+' × '+money(dayRate)+'</b></div><div style="margin-top:12px;padding:14px;border-radius:14px;background:var(--panel2,#102b45);border:1px solid var(--line)"><span class="subtle">Estimated salary</span><div style="font-size:clamp(25px,6vw,34px);font-weight:900;color:var(--gold)">'+money(amount)+'</div></div><p class="subtle" style="font-size:12px">Calculated from saved Work day entries only. Day off and unmarked dates are not included.</p>';
 }
 document.getElementById('savePayrollSettings').onclick=async()=>{
  if(!owner)return;
  if(!start.value||!end.value||start.value>end.value||Number(rate.value)<0||rate.value===''){alert('Enter a valid salary period and daily wage.');return}
  const {error}=await sb.from('payroll_settings').upsert({user_id:targetUserId,daily_rate:Number(rate.value),period_start:start.value,period_end:end.value,updated_by:currentUser.id,updated_at:new Date().toISOString()},{onConflict:'user_id'});
  if(error){alert('Could not save salary settings: '+error.message);return}alert('Salary settings saved.');await load();
 };
 document.getElementById('savePayrollAttendance').onclick=async()=>{
  const rows=[...document.querySelectorAll('.payroll-day')].map(x=>({work_date:x.dataset.date,status:x.value}));const marked=rows.filter(x=>x.status);
  if(marked.length){const payload=marked.map(x=>({user_id:targetUserId,work_date:x.work_date,status:x.status,updated_by:currentUser.id,updated_at:new Date().toISOString()}));const {error}=await sb.from('payroll_attendance').upsert(payload,{onConflict:'user_id,work_date'});if(error){alert('Could not save attendance: '+error.message);return}}
  for(const row of rows.filter(x=>!x.status)){const {error}=await sb.from('payroll_attendance').delete().eq('user_id',targetUserId).eq('work_date',row.work_date);if(error){alert('Some blank attendance dates could not be cleared: '+error.message);return}}
  alert('Attendance saved.');await load();
 };
 document.getElementById('refreshPayroll').onclick=()=>load().catch(e=>alert(e.message));
 start.onchange=()=>{if(start.value&&end.value&&start.value<=end.value)load().catch(e=>alert(e.message))};
 end.onchange=()=>{if(start.value&&end.value&&start.value<=end.value)load().catch(e=>alert(e.message))};
 if(owner)document.getElementById('payrollPerson').onchange=()=>load().catch(e=>alert(e.message));
 try{await load()}catch(e){calendar.innerHTML='<p class="auth-error">Could not load payroll: '+esc(e.message)+'</p>';summary.textContent='Please refresh and try again.'}
}

function renderMonthly(){
 const root=document.getElementById('pageContent');
 root.dataset.uiPage='monthly';
 const now=new Date(),today=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
 const first=today.slice(0,8)+'01';
 root.innerHTML='<div class="report-page">'+
  '<section class="panel report-hero"><div class="report-heading"><div><span class="report-eyebrow">TICKET CONTROL · REPORTS</span><h2>'+tr('report')+'</h2><p class="subtle">Review ticket inventory for a selected date range</p></div><span class="report-icon">▤</span></div>'+
  '<div class="report-filters"><label>'+tr('from')+'<input type="date" id="fromDate" value="'+first+'"></label><label>'+tr('to')+'<input type="date" id="toDate" value="'+today+'"></label></div>'+
  '<div class="report-department-filter"><label for="reportDepartment">Department</label><select id="reportDepartment"><option value="all">All Departments</option>'+DEPTS.map(d=>'<option value="'+esc(d.id)+'">'+esc(d[lang]||d.en)+'</option>').join('')+'</select></div>'+
  '<div class="report-actions"><button class="gold" id="makeMonthly">▤ '+tr('report')+'</button><button id="downloadMonthly" class="report-secondary">⇩ Save image</button><button class="blue" id="shareMonthly">↗ Share report</button></div>'+
  '<p id="monthlyError" class="report-error" role="alert" aria-live="polite"></p></section>'+
  '<section id="monthlyResults" class="report-results" aria-live="polite"></section>'+
  '<p class="report-footnote">This report summarizes the current ticket records using their last updated date (or creation date). It is an inventory snapshot, not a transaction-by-transaction sales history.</p>'+
 '</div>';
 const from=document.getElementById('fromDate'),to=document.getElementById('toDate'),results=document.getElementById('monthlyResults'),error=document.getElementById('monthlyError');
 const calc=()=>{
  const f=from.value,t=to.value;
  if(!f||!t){error.textContent='Please select both report dates.';return null}
  if(f>t){error.textContent='The start date must be on or before the end date.';return null}
  error.textContent='';
  const dept=document.getElementById('reportDepartment')?.value||'all';
  return tickets.filter(x=>{const stamp=String(x.updatedAt||x.createdAt||'').slice(0,10);return stamp&&stamp>=f&&stamp<=t&&(dept==='all'||x.department===dept)});
 };
 const report=()=>{
  const list=calc();if(!list){results.innerHTML='';return false}
  const quantity=list.reduce((sum,x)=>sum+(Number(x.quantity)||0),0);
  const value=list.reduce((sum,x)=>sum+(Number(x.quantity)||0)*(Number(x.price)||0),0);
  const departments=DEPTS.map(d=>{
   const rows=list.filter(x=>x.department===d.id);
   const qty=rows.reduce((sum,x)=>sum+(Number(x.quantity)||0),0);
   const amount=rows.reduce((sum,x)=>sum+(Number(x.quantity)||0)*(Number(x.price)||0),0);
   return '<article class="report-dept"><div class="report-dept-title"><span class="report-dept-icon">'+d.icon+'</span><strong>'+esc(d[lang]||d.en)+'</strong></div><div class="report-dept-stats"><div><small>Ticket types</small><b>'+rows.length.toLocaleString()+'</b></div><div><small>Total quantity</small><b>'+qty.toLocaleString()+'</b></div><div><small>Inventory value</small><b>'+money(amount)+'</b></div></div></article>';
  }).join('');
  results.innerHTML='<div class="report-range"><span>REPORT PERIOD · '+esc((document.getElementById('reportDepartment')?.selectedOptions[0]?.textContent)||'All Departments')+'</span><strong>'+fDate(from.value)+' – '+fDate(to.value)+'</strong></div>'+
   '<div class="report-kpis"><article class="report-kpi"><span>Ticket types</span><strong>'+list.length.toLocaleString()+'</strong></article><article class="report-kpi"><span>Total quantity</span><strong>'+quantity.toLocaleString()+'</strong></article><article class="report-kpi report-kpi-gold"><span>Inventory value</span><strong>'+money(value)+'</strong></article></div>'+
   '<div class="report-section-title"><h3>Department breakdown</h3><span>'+DEPTS.length+' departments</span></div>'+
   (list.length?departments:'<div class="report-empty">No ticket records were found for this date range.</div>');
  return true;
 };
 const fDate=value=>new Intl.DateTimeFormat(lang==='th'?'th-TH':'en-GB',{day:'2-digit',month:'short',year:'numeric',timeZone:'Asia/Bangkok'}).format(new Date(value+'T12:00:00+07:00'));
 document.getElementById('reportDepartment').onchange=report;
 document.getElementById('makeMonthly').onclick=report;
 document.getElementById('downloadMonthly').onclick=async()=>{const list=calc();if(list)await saveReportList(list,'Monthly Ticket Inventory Report')};
 document.getElementById('shareMonthly').onclick=async()=>{const list=calc();if(list)await shareReportList(list,'Monthly Ticket Inventory Report')};
 report();
}
function renderSettings(){document.getElementById('pageContent').dataset.uiPage='settings';document.getElementById('pageContent').innerHTML='<div class="panel"><h2>'+tr('cloud')+'</h2><p>'+tr('cloudMsg')+'</p><div class="summary-row"><span>Language / ภาษา</span><select id="settingLang" style="max-width:140px"><option value="en">English</option><option value="th">ไทย</option></select></div><div class="summary-row"><span>Display theme</span><select id="themeSelect" style="max-width:160px"><option value="dark">Dark · Navy + Gold</option><option value="light">Light · Daylight</option></select></div><p class="subtle">Premium Dark Navy + Champagne Gold is the default. Ticket records are synced to the Ticket Control Live cloud database.</p><button id="exportAll" class="gold">Export all ticket data (JSON)</button></div>';document.getElementById('settingLang').value=lang;document.getElementById('settingLang').onchange=e=>{lang=e.target.value;localStorage.setItem('tctl-lang',lang);render()};document.getElementById('themeSelect').value=theme;document.getElementById('themeSelect').onchange=e=>{theme=e.target.value;localStorage.setItem('tctl-theme',theme);applyTheme()};document.getElementById('exportAll').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(tickets,null,2)],{type:'application/json'}));a.download='ticket-control-backup.json';a.click();URL.revokeObjectURL(a.href)}}
function renderDatabase(){document.getElementById('pageContent').dataset.uiPage=page;document.getElementById('pageContent').innerHTML='<div class="panel"><h2>'+(page==='owner'?'Owner Database':'Staff Database')+'</h2><p>'+tr('staffNotice')+'</p><div class="notice">'+(page==='owner'?'Owner permissions and secure account provisioning are not configured.':'Staff name, department login, and activity logs require Firebase Authentication and database rules.')+'</div><p class="subtle">Signed in as ; account permissions are managed by the Ticket Control Live database.</p></div>'}
function applyTheme(){document.body.classList.toggle('theme-light',theme==='light')}
document.getElementById('language').onchange=e=>{lang=e.target.value;localStorage.setItem('tctl-lang',lang);render()};document.getElementById('openMenu').onclick=()=>{document.getElementById('side').classList.add('open');document.getElementById('shade').classList.add('open')};document.getElementById('closeMenu').onclick=()=>{document.getElementById('side').classList.remove('open');document.getElementById('shade').classList.remove('open')};document.getElementById('shade').onclick=()=>document.getElementById('closeMenu').click();document.getElementById('closeAction').onclick=()=>document.getElementById('actionModal').classList.remove('open');applyTheme();render();
</script></body></html>
