function populateOpenTrainTrips(){const sel=document.getElementById('trainReturnTrip');if(!sel)return;const open=trainRows.filter(r=>!r.return_time).sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));const chosen=open[0];sel.innerHTML=chosen?'<option value="'+chosen.id+'">'+escapeHtml(fmtDate(chosen.trip_date)+' · '+fmtTime(chosen.depart_time))+'</option>':'';sel.value=chosen?.id||'';const summary=document.getElementById('trainReturnSummary');if(summary)summary.value=chosen?fmtDate(chosen.trip_date)+' · '+fmtTime(chosen.depart_time)+' · '+chosen.riders+' riders · '+chosen.driver_name:'No active departure';const departCard=document.querySelector('.train-depart-card'),returnCard=document.querySelector('.train-return-card');if(departCard)departCard.style.display=chosen?'none':'';if(returnCard)returnCard.style.display=chosen?'':'none';const departForm=document.getElementById('trainDepartForm');if(departForm)departForm.querySelector('button[type="submit"]').disabled=!!chosen}

async function editTrainRow(id){const r=trainRows.find(x=>x.id===id);if(!r)return;const depart=prompt('Departure time (HH:MM)',fmtTime(r.depart_time));if(depart===null)return;const back=prompt('Return time (HH:MM, blank if not returned)',fmtTime(r.return_time)==='—'?'':fmtTime(r.return_time));if(back===null)return;const riders=prompt('Number of riders',String(r.riders));if(riders===null)return;const driver=prompt('Driver name',r.driver_name);if(driver===null)return;const date=prompt('Trip date (YYYY-MM-DD)',r.trip_date);if(date===null)return;if(!/^\d{2}:\d{2}$/.test(depart)|| (back&&!/^\d{2}:\d{2}$/.test(back))||!Number.isInteger(Number(riders))||Number(riders)<0||!driver.trim()||!/^\d{4}-\d{2}-\d{2}$/.test(date)){alert('Please check the time, date, rider count and driver name.');return}const {error}=await sb.from('train_time_logs').update({depart_time:depart,return_time:back||null,riders:Number(riders),driver_name:driver.trim(),trip_date:date,updated_by:currentUser.id,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert('Edit failed: '+error.message);return}await loadTrainData()}

function exportTrainCsv(){const rows=[['No','Date','Depart Time','Return Time','Riders','Driver Name','Duration minutes'],...trainRows.map((r,i)=>[i+1,r.trip_date,fmtTime(r.depart_time),fmtTime(r.return_time),r.riders,r.driver_name,durationMins(r.depart_time,r.return_time)??''])];const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='train-time-report-'+localToday()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function cloudRowForTicket(t){
 return {id:t.id,department:t.department,name:t.name,price:t.price??null,quantity:Number(t.quantity||0),image_path:t.imagePath||null,image_url:t.imageUrl||null,location:t.location||null,created_by:t.createdBy||currentUser.id,updated_by:currentUser.id,created_at:t.createdAt||new Date().toISOString(),updated_at:t.updatedAt||new Date().toISOString()};
}
function save(){
 try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(storageError){console.warn('Local cache full; Cloud sync will continue.',storageError)}
 if(!currentUser||!cloudReady)return;
 const changed=[];
 for(const t of tickets){
  const row=cloudRowForTicket(t);
  const prior=lastCloudRows.get(String(t.id));
  const fields=['department','name','price','quantity','image_path','image_url','location'];
  const differs=!prior||fields.some(k=>(prior[k]??null)!==(row[k]??null));
  if(differs){row.updated_at=new Date().toISOString();t.updatedAt=row.updated_at;changed.push(row)}
 }
 if(changed.length)syncTickets(changed);
}
let syncBusy=false,syncPending=null;
async function syncTickets(snapshot){
 syncPending=snapshot;
 if(syncBusy)return;
 syncBusy=true;
 try{
  while(syncPending){
   const next=syncPending;syncPending=null;
   if(next.length){const {error}=await sb.from('tickets').upsert(next,{onConflict:'id'});if(error)throw error;for(const row of next)lastCloudRows.set(String(row.id),row);lastCloudFingerprint='';const banner=document.getElementById('cloudSyncStatus');if(banner)banner.style.display='none';}
  }
 }catch(e){console.error('Cloud sync failed',e);showCloudError('Cloud sync failed: '+(e.message||e));syncPending=syncPending||snapshot;setTimeout(()=>{if(!syncBusy&&syncPending)syncTickets(syncPending)},3000);}
 finally{syncBusy=false;if(syncPending)syncTickets(syncPending);}
}
function showCloudError(msg){const e=document.getElementById('authError');if(e&&document.getElementById('authScreen').style.display!=='none')e.textContent=msg;else console.error(msg)}
function mapCloud(row){return {id:row.id,department:row.department,name:row.name,price:row.price===null?null:Number(row.price),quantity:Number(row.quantity||0),image:row.image_url||null,imageUrl:row.image_url||null,imagePath:row.image_path||null,location:row.location||'',createdAt:row.created_at,updatedAt:row.updated_at,createdBy:row.created_by}}
async function loadCloud(){
 // Capture local tickets before reading Cloud: the Owner browser may contain the only surviving copy.
 let localTicketsBeforeCloud=[];
 try{localTicketsBeforeCloud=JSON.parse(localStorage.getItem('tctl-new-tickets')||'[]');if(!Array.isArray(localTicketsBeforeCloud))localTicketsBeforeCloud=[]}catch(e){console.warn('Could not parse local ticket cache',e)}
 // Do not write a duplicate backup to localStorage; it can exceed mobile browser quota.
 // Read existing cache/backup if present, but leave them untouched.
 const {data,error}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
 if(error)throw error;
 let cloudRows=data||[];
 // One-time recovery: when the cloud table is empty but this browser has tickets, migrate that local copy to Cloud.
 // Never overwrite non-empty Cloud data and never delete local tickets during recovery.
 if(cloudRows.length===0 && localTicketsBeforeCloud.length>0){
  const recovered=[];
  for(const t of localTicketsBeforeCloud){
   if(!t||!['sale','entry','playing','event'].includes(t.department)||!String(t.name||'').trim())continue;
   if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(String(t.id||'')))t.id=crypto.randomUUID();
   let imageUrl=t.imageUrl||t.image||null,imagePath=t.imagePath||null;
   if(typeof imageUrl==='string' && imageUrl.startsWith('data:') && currentUser){
    try{
     const blob=await (await fetch(imageUrl)).blob();
     const ext=(blob.type.split('/')[1]||'jpeg').replace(/[^a-z0-9]/gi,'')||'jpg';
     const path=currentUser.id+'/'+t.id+'/recovered-'+Date.now()+'.'+ext;
     const {error:uploadError}=await sb.storage.from('ticket-images').upload(path,blob,{upsert:true,contentType:blob.type||'image/jpeg'});
     if(!uploadError){imagePath=path;imageUrl=sb.storage.from('ticket-images').getPublicUrl(path).data.publicUrl}else{console.warn('Could not recover ticket image',uploadError);imageUrl=null}
    }catch(imageError){console.warn('Could not recover ticket image',imageError);imageUrl=null}
   }
   if(typeof imageUrl==='string' && imageUrl.startsWith('data:'))imageUrl=null;
   t.imagePath=imagePath;t.imageUrl=imageUrl;t.image=imageUrl;
   const recoveredRow=cloudRowForTicket(t);recoveredRow.created_by=currentUser.id;recoveredRow.updated_by=currentUser.id;recovered.push(recoveredRow);
  }
  if(recovered.length){
   const {error:migrateError}=await sb.from('tickets').upsert(recovered,{onConflict:'id'});
   if(migrateError)throw new Error('Cloud is empty and local tickets were found, but recovery upload failed: '+migrateError.message);
   const {data:reloaded,error:reloadError}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
   if(reloadError)throw reloadError;
   cloudRows=reloaded||[];
  }
 }
 tickets=cloudRows.map(mapCloud);lastCloudRows=new Map(cloudRows.map(r=>[String(r.id),r]));lastCloudFingerprint=JSON.stringify(cloudRows.map(r=>[r.id,r.department,r.name,r.price,r.quantity,r.image_path,r.image_url,r.location,r.updated_at]));cloudReady=true;try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(storageError){console.warn('Local ticket cache is full; using Cloud data for this session.',storageError)}render();
}
let cloudPollTimer=null,cloudLoadBusy=false,lastCloudFingerprint='';
async function refreshCloudTickets(force=false){
 if(!currentUser||!cloudReady)return;
 // Do not let an empty/stale read replace local edits while their Cloud upsert is still running.
 if(syncBusy)return;
 // Continue polling even when this tab is in the background; mobile split-screen and tab switching must not stall sync.
 const modal=document.getElementById('ticketModal');
 if(modal&&modal.classList.contains('open')&&!force)return;
 if(cloudLoadBusy)return;
 cloudLoadBusy=true;
 try{
  const {data,error}=await sb.from('tickets').select('*').order('created_at',{ascending:true});
  if(error)throw error;
  const rows=data||[];
  const fingerprint=JSON.stringify(rows.map(r=>[r.id,r.department,r.name,r.price,r.quantity,r.image_path,r.image_url,r.location,r.updated_at]));
  if(force||fingerprint!==lastCloudFingerprint){
   lastCloudFingerprint=fingerprint;
   tickets=rows.map(mapCloud);
   lastCloudRows=new Map(rows.map(r=>[String(r.id),r]));
   try{localStorage.setItem('tctl-new-tickets',JSON.stringify(tickets))}catch(storageError){console.warn('Local cache full; Cloud data is still active.',storageError)}
   render();
  }
 }catch(e){console.error('Auto-refresh cloud tickets failed',e)}
 finally{cloudLoadBusy=false}
}
function listenRealtime(){
 if(cloudChannel)sb.removeChannel(cloudChannel);
 cloudChannel=sb.channel('ticket-control-live-'+(currentUser?.id||'session'))
  .on('postgres_changes',{event:'*',schema:'public',table:'tickets'},async()=>{await refreshCloudTickets(true)})
  .subscribe(status=>{console.log('Ticket realtime status:',status)});
 if(cloudPollTimer)clearInterval(cloudPollTimer);
 cloudPollTimer=setInterval(()=>refreshCloudTickets(false),1500);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshCloudTickets(true)});
 window.addEventListener('focus',()=>refreshCloudTickets(true));
}

async function startCloudSession(session,notifyOwnerPush=false){
 currentUser=session.user;
 const {data:profile,error:profileError}=await sb.from('profiles').select('role,display_name,avatar_url').eq('id',currentUser.id).maybeSingle();
 if(profileError||!profile){document.getElementById('authScreen').style.display='grid';document.getElementById('authError').textContent='Staff profile is not ready. Please try again.';return}
 currentRole=profile.role;
 if(currentRole!=='staff'){await sb.auth.signOut();currentUser=null;document.getElementById('authScreen').style.display='grid';document.getElementById('authError').textContent='This page is for staff only. Please use the Owner website link.';return}
 const enteredName=document.getElementById('authName').value.trim();
 if(enteredName && profile.display_name && enteredName.toLowerCase()!==profile.display_name.trim().toLowerCase()){
   document.getElementById('authScreen').style.display='grid';document.getElementById('authError').textContent='This session belongs to a different staff name. Please sign out and continue with your name.';return;
 }
 let sharedProfile=profile;if(!sharedProfile.avatar_url&&profile.display_name){try{const {data:matches,error:matchError}=await sb.from('profiles').select('display_name,avatar_url,role').eq('role','staff').ilike('display_name',profile.display_name.trim()).not('avatar_url','is',null).limit(10);if(!matchError&&matches?.length){const match=matches.find(x=>x.avatar_url&&String(x.avatar_url).trim());if(match)sharedProfile={...profile,avatar_url:match.avatar_url}}}catch(photoLookupError){console.warn('Could not resolve shared staff photo by name:',photoLookupError)}}
 const requestedDepartment=document.getElementById('staffDepartment').value||localStorage.getItem('tctl-staff-department')||'all';

 // Keep "All Departments" as the staff permission/visible-menu choice, but open Sale first
 // so the four departments are available in the menu without mixing ticket cards together.

async function saveReportList(list,titleText){try{const blob=await createReportBlob(list,titleText);if(!blob)throw new Error('Could not create image');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ticket-report-'+new Date().toISOString().slice(0,10)+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}catch(e){alert('Could not save report image: '+(e.message||e))}}
async function shareReportList(list,titleText){try{const blob=await createReportBlob(list,titleText);if(!blob)throw new Error('Could not create image');const file=new File([blob], 'ticket-report-'+new Date().toISOString().slice(0,10)+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:titleText||'Ticket Report'});return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);alert('Report image downloaded. You can share the PNG from your Downloads folder.')}catch(e){if(e.name!=='AbortError')alert('Could not share report image: '+(e.message||e))}}
function downloadReportBlob(blob,filename){return new Promise((resolve,reject)=>{try{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url);resolve(true)},60000);setTimeout(()=>{if(a.isConnected)a.remove()},1000)}catch(e){reject(e)}})}
