name: Optimize PDK1 video for mobile playback

on:
  push:
    branches:
      - feature/pwa-app-shell
    paths:
      - '.github/workflows/optimize-pdk1-video.yml'

permissions:
  contents: write

jobs:
  optimize-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Preview branch
        uses: actions/checkout@v4
        with:
          ref: feature/pwa-app-shell
          fetch-depth: 0

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Re-encode PDK1 for Android and iOS compatibility
        run: |
          ffmpeg -y -i PDK1.mp4 \
            -map 0:v:0 -map '0:a?' \
            -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2,format=yuv420p" \
            -c:v libx264 -profile:v main -level:v 4.0 \
            -preset slow -crf 21 -maxrate 6M -bufsize 12M \
            -r 30 -fps_mode cfr -g 60 -keyint_min 60 -sc_threshold 0 \
            -color_primaries bt709 -color_trc bt709 -colorspace bt709 \
            -c:a aac -b:a 128k -ar 48000 -ac 2 \
            -movflags +faststart /tmp/PDK1-mobile.mp4
          echo "Original:"
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,level -of default=noprint_wrappers=1 PDK1.mp4
          echo "Optimized:"
          ffprobe -v error -show_entries stream=codec_name,profile,width,height,pix_fmt,level -of default=noprint_wrappers=1 /tmp/PDK1-mobile.mp4
          ls -lh PDK1.mp4 /tmp/PDK1-mobile.mp4
          mv /tmp/PDK1-mobile.mp4 PDK1.mp4

      - name: Commit optimized video to Preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PDK1.mp4
          git commit -m "Optimize PDK1 video for mobile playback"
          git push origin HEAD:feature/pwa-app-shell
